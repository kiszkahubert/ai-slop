name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  e2e:
    needs: lint-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # software (SwiftShader) rendering: screenshots are slow, so allow 2 minutes each
      - run: npm run test:e2e
        env:
          SHOT_TIMEOUT: '120000'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tests/out/
          if-no-files-found: ignore
